name: notes-demo

services:
  traefik:
    image: traefik:v3.7.13
    container_name: notes-traefik
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=notes
      - --providers.file.filename=/etc/traefik/tls.yml
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/tls.yml:/etc/traefik/tls.yml:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - notes

  ignis:
    image: nobbe/ignis:0.8.10
    container_name: notes-ignis
    restart: unless-stopped
    environment:
      PORT: "8080"
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      WS_ORIGINS: https://ignis.${HOST_IP:?set HOST_IP in .env}.sslip.io
      UV_THREADPOOL_SIZE: "4"
      WRITE_COALESCE_MS: "0"
      # create "My Vault" on first start, so no seeding step is needed
      AUTO_CREATE_DEFAULT: "true"
    volumes:
      - ./data/vaults:/vaults
      - ./data/ignis:/app/data
      - obsidian-app:/app/obsidian-app
    labels:
      - traefik.enable=true
      # websecure router: cross-origin isolation for Obsidian's browser APIs
      - traefik.http.routers.ignis.entrypoints=websecure
      - traefik.http.routers.ignis.rule=Host(`ignis.${HOST_IP:?set HOST_IP in .env}.sslip.io`)
      - traefik.http.routers.ignis.service=ignis
      - traefik.http.routers.ignis.tls=true
      - traefik.http.routers.ignis.middlewares=ignis-headers@docker
      - traefik.http.services.ignis.loadbalancer.server.port=8080
      # isolation headers Obsidian's browser APIs need
      - traefik.http.middlewares.ignis-headers.headers.customresponseheaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.ignis-headers.headers.customresponseheaders.Cross-Origin-Embedder-Policy=credentialless
      # plain HTTP -> HTTPS redirect for all three app hostnames
      - traefik.http.routers.ignis-redirect.entrypoints=web
      - traefik.http.routers.ignis-redirect.rule=Host(`ignis.${HOST_IP:?set HOST_IP in .env}.sslip.io`) || Host(`ignis-webdav.${HOST_IP:?set HOST_IP in .env}.sslip.io`) || Host(`ignis-git.${HOST_IP:?set HOST_IP in .env}.sslip.io`)
      - traefik.http.routers.ignis-redirect.service=ignis
      - traefik.http.routers.ignis-redirect.middlewares=ignis-redirect-middleware@docker
      - traefik.http.middlewares.ignis-redirect-middleware.redirectregex.regex=^http://([^/]+)/(.*)$$
      - traefik.http.middlewares.ignis-redirect-middleware.redirectregex.replacement=https://ignis.${HOST_IP:?set HOST_IP in .env}.sslip.io/$$2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks:
      - notes

  webdav:
    image: rclone/rclone:1.75.0
    container_name: notes-webdav
    restart: unless-stopped
    user: "1000:1000"
    environment:
      WEBDAV_USER: ${WEBDAV_USER:?set WEBDAV_USER in .env}
      WEBDAV_PASS: ${WEBDAV_PASS:?set WEBDAV_PASS in .env}
    command:
      - serve
      - webdav
      - /vaults
      - --addr
      - ":8081"
      - --user
      - ${WEBDAV_USER:?set WEBDAV_USER in .env}
      - --pass
      - ${WEBDAV_PASS:?set WEBDAV_PASS in .env}
      - --vfs-cache-mode
      - "off"
      - --dir-cache-time
      - 5s
      - --exclude
      - "/.git/**"
      - --exclude
      - "/**/.git/**"
    volumes:
      - ./data/vaults:/vaults
    labels:
      - traefik.enable=true
      - traefik.http.routers.webdav.entrypoints=websecure
      - traefik.http.routers.webdav.rule=Host(`ignis-webdav.${HOST_IP:?set HOST_IP in .env}.sslip.io`)
      - traefik.http.routers.webdav.service=webdav
      - traefik.http.routers.webdav.tls=true
      - traefik.http.routers.webdav.middlewares=webdav-headers@docker
      - traefik.http.services.webdav.loadbalancer.server.port=8081
      # rclone --exclude hides .git from listings, but it does not deny write
      # methods. A higher-priority Traefik router rejects every request whose
      # path contains a .git component, before it reaches rclone.
      - traefik.http.routers.webdav-git-deny.entrypoints=websecure
      - traefik.http.routers.webdav-git-deny.rule=Host(`ignis-webdav.${HOST_IP:?set HOST_IP in .env}.sslip.io`) && PathRegexp(`(?i)(^|/)\.git(/|$)`)
      - traefik.http.routers.webdav-git-deny.priority=1000
      - traefik.http.routers.webdav-git-deny.service=webdav
      - traefik.http.routers.webdav-git-deny.tls=true
      - traefik.http.routers.webdav-git-deny.middlewares=webdav-git-deny@docker
      - traefik.http.middlewares.webdav-git-deny.ipallowlist.sourcerange=192.0.2.0/24
      - traefik.http.middlewares.webdav-headers.headers.customresponseheaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.webdav-headers.headers.customresponseheaders.Cross-Origin-Embedder-Policy=credentialless
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notes

  git-ui:
    image: alpine/git:v2.54.0
    container_name: notes-git
    restart: unless-stopped
    user: "1000:1000"
    # This image ships ENTRYPOINT ["git"], and Compose's `command:` only
    # replaces CMD, so the entrypoint itself has to be replaced here.
    entrypoint: ["/bin/sh", "/opt/git-ui/run.sh"]
    environment:
      LAZYGIT_VERSION: "0.64.1"
      TTYD_VERSION: "1.7.7"
      GIT_UI_PORT: "7681"
      GIT_NAME: "ignis"
      GIT_EMAIL: "ignis@homelab.local"
      GIT_USER: ${GIT_USER:?set GIT_USER in .env}
      GIT_TOKEN: ${GIT_TOKEN:?set GIT_TOKEN in .env}
      GIT_REMOTE_BASE_URL: ${GIT_REMOTE_BASE_URL:-CHANGE_ME_GIT_BASE_URL}
    volumes:
      - ./config/git-ui:/opt/git-ui:ro
      - ./data/vaults:/vaults
    labels:
      - traefik.enable=true
      - traefik.http.routers.git-ui.entrypoints=websecure
      - traefik.http.routers.git-ui.rule=Host(`ignis-git.${HOST_IP:?set HOST_IP in .env}.sslip.io`)
      - traefik.http.routers.git-ui.service=git-ui
      - traefik.http.routers.git-ui.tls=true
      - traefik.http.routers.git-ui.middlewares=git-ui-headers@docker
      - traefik.http.services.git-ui.loadbalancer.server.port=7681
      # headers the ttyd terminal client needs
      - traefik.http.middlewares.git-ui-headers.headers.customresponseheaders.Cross-Origin-Resource-Policy=same-site
      - traefik.http.middlewares.git-ui-headers.headers.customresponseheaders.Cross-Origin-Embedder-Policy=require-corp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7681/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - notes

  git-mcp:
    build: ./git-mcp
    container_name: notes-mcp
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      MCP_GIT_TOKEN: ${MCP_GIT_TOKEN:-}
      GIT_USER: ${GIT_USER:-}
      GIT_REMOTE_BASE_URL: ${GIT_REMOTE_BASE_URL:-CHANGE_ME_GIT_BASE_URL}
      MCP_GIT_AUTHOR_NAME: ${MCP_GIT_AUTHOR_NAME:-hermes}
      MCP_GIT_AUTHOR_EMAIL: ${MCP_GIT_AUTHOR_EMAIL:-hermes@homelab.local}
      MCP_PUBLIC_HOST: ignis-mcp.${HOST_IP:?set HOST_IP in .env}.sslip.io
    volumes:
      - ./data/vaults:/vaults
      - ./config/git-ui:/opt/git-ui:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.git-mcp.entrypoints=websecure
      - traefik.http.routers.git-mcp.rule=Host(`ignis-mcp.${HOST_IP:?set HOST_IP in .env}.sslip.io`)
      - traefik.http.routers.git-mcp.service=git-mcp
      - traefik.http.routers.git-mcp.tls=true
      - traefik.http.services.git-mcp.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notes

  openai-tunnel:
    image: ghcr.io/openai/tunnel-client:v0.0.21
    container_name: notes-openai-tunnel
    profiles: ["openai"]
    restart: unless-stopped
    depends_on:
      git-mcp:
        condition: service_healthy
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:-}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:-}
      MCP_SERVER_URL: http://git-mcp:8080/mcp
      MCP_OAUTH_DISCOVERY: disabled
      MCP_EXTRA_HEADERS: "Authorization: Bearer ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}"
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - notes

networks:
  notes:
    name: notes

volumes:
  obsidian-app:
