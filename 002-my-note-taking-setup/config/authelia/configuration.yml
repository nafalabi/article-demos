# Authelia configuration for the note-taking demo.
#
# The four hostnames below must match HOST_IP in .env. The demo ships them set
# to 192.168.1.12, this machine. If you change HOST_IP, edit them here too
# (three lines) — `scripts/verify.sh` fails with a clear message if they drift.
#
# Secrets are not in this file: AUTHELIA_SESSION_SECRET and
# AUTHELIA_STORAGE_ENCRYPTION_KEY come from .env. The pinned image (4.39.24)
# rejects the older `session.encryption_key`, so this uses `session.secret`.
---
theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml

session:
  cookies:
    - domain: 192.168.1.12.sslip.io
      authelia_url: https://auth.192.168.1.12.sslip.io

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

access_control:
  default_policy: deny
  rules:
    - domain: ignis.192.168.1.12.sslip.io
      policy: one_factor
    - domain: ignis-git.192.168.1.12.sslip.io
      policy: one_factor
